<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Pengajuan PO — Naintiland</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16332f; --ink2:#4a6663; --teal:#0f8a8c; --teal-d:#0a6c72; --teal-l:#3fb3b0;
  --glass:rgba(255,255,255,.38); --glass2:rgba(255,255,255,.55); --line:rgba(22,51,47,.12);
  --ok:#0f8a8c; --wait:#e8a23a; --no:#ef6f7f; --draft:#8fa3a8;
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);font-size:14px;
  background:linear-gradient(120deg,#a9cfd0 0%,#b4d6d3 35%,#a8cbd6 62%,#b3addb 100%) fixed;padding:28px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 56px);
  background:rgba(255,255,255,.26);border:1.5px solid rgba(255,255,255,.7);border-radius:28px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 60px -30px rgba(20,70,80,.45);overflow:hidden}
.side{padding:30px 18px;border-right:1px solid rgba(255,255,255,.55);display:flex;flex-direction:column;gap:6px}
.brand{font-weight:600;font-size:17px;padding:4px 12px 22px;line-height:1.25}
.brand small{display:block;font-weight:400;font-size:11.5px;color:var(--ink2)}
.nav{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:none;border-radius:14px;color:var(--teal-d);font-weight:500;font-size:13px;text-align:left;width:100%}
.nav svg{width:18px;height:18px;flex:none}
.nav:hover{background:rgba(255,255,255,.35)}
.nav.on{background:linear-gradient(135deg,#0a7377,#35aaa8);color:#fff;box-shadow:0 10px 20px -10px rgba(10,108,114,.8)}
.nav .cnt{margin-left:auto;background:var(--no);color:#fff;border-radius:99px;font-size:11px;padding:1px 8px}
.side hr{border:0;border-top:1px solid var(--line);margin:14px 10px;width:auto}
.main{padding:30px 34px 40px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}
.hello{color:var(--teal);font-weight:500}
h1{font-size:34px;font-weight:600;margin:6px 0 0;letter-spacing:-.5px}
.who{display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 10px;border-radius:14px;text-align:left}
.who:hover{background:var(--glass)}
.ava{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#0a7377,#7b74d6);color:#fff;display:grid;place-items:center;font-weight:600}
.who b{display:block;font-size:13px;font-weight:600}.who span{font-size:11.5px;color:var(--ink2)}
.card{background:var(--glass);border:1.5px solid rgba(255,255,255,.75);border-radius:var(--r);padding:22px 24px;
  box-shadow:0 14px 30px -22px rgba(20,70,80,.6)}
.card h2{font-size:15px;font-weight:500;margin:0}
.chead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--teal);font-weight:500;font-size:12.5px;padding:0}
.link:hover{text-decoration:underline}
.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:20px}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.tile{display:flex;gap:14px;align-items:center;padding:18px 20px}
.ticon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.ticon svg{width:18px;height:18px}
.t1{background:linear-gradient(135deg,#8e7cf0,#b9a8ff)}.t2{background:linear-gradient(135deg,#f06bb5,#ff9ccf)}
.t3{background:linear-gradient(135deg,#f6a54a,#ffcf8a)}.t4{background:linear-gradient(135deg,#0a7377,#49b8b3)}
.tile small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:500}
.tile strong{font-size:24px;font-weight:500;line-height:1.2;white-space:nowrap}
.tile strong i{font-style:normal;font-size:14px}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.7);margin-bottom:16px}
.bar span{display:block}
.legend{display:grid;grid-template-columns:repeat(4,1fr);border:1.5px solid rgba(255,255,255,.8);border-radius:14px;padding:12px 6px}
.legend div{text-align:center;border-left:1px solid var(--line)}.legend div:first-child{border:0}
.legend small{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.legend b{font-size:17px;font-weight:500}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.cta{position:relative;overflow:hidden;border-radius:var(--r);padding:26px 26px;color:#fff;background:linear-gradient(120deg,#0a6c72,#2fa5a4);min-height:150px}
.cta small{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.cta h3{font-size:21px;font-weight:600;margin:6px 0 16px;max-width:260px;line-height:1.25}
.cta .pill{background:#fff;color:var(--teal-d);border:0;border-radius:99px;padding:9px 18px;font-weight:600;font-size:12.5px}
.cta i{position:absolute;border-radius:50%;display:block}
.cta .a{width:150px;height:150px;right:-30px;bottom:-60px;background:#2b62d9}
.cta .b{width:54px;height:54px;right:70px;top:18px;background:#a6d83c}
.cta .c{width:60px;height:60px;right:110px;bottom:22px;background:#fff;border-radius:16px;transform:rotate(18deg)}
.cta .d{width:34px;height:34px;right:28px;top:62px;border:5px solid #c58bf2;background:none}
table{width:100%;border-collapse:collapse}
th{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-weight:500;text-align:left;padding:6px 8px}
td{padding:13px 8px;border-top:1px solid var(--line);vertical-align:middle}
tr:first-child td{border-top:0}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.pono{font-weight:600;color:var(--teal-d);background:none;border:0;padding:0;white-space:nowrap}
.pono:hover{text-decoration:underline}
.st{display:inline-block;padding:4px 11px;border-radius:99px;font-size:11.5px;font-weight:500;white-space:nowrap}
.st.draft{background:rgba(143,163,168,.25);color:#4d6368}.st.diajukan{background:rgba(232,162,58,.22);color:#8a5a0b}
.st.disetujui{background:rgba(15,138,140,.18);color:var(--teal-d)}.st.ditolak{background:rgba(239,111,127,.22);color:#a83246}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.btn{border:1.5px solid rgba(255,255,255,.85);background:var(--glass2);border-radius:11px;padding:8px 14px;font-weight:500;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#fff}
.btn.p{background:linear-gradient(135deg,#0a7377,#35aaa8);color:#fff;border-color:transparent}
.btn.p:hover{filter:brightness(1.07)}
.btn.d{color:#a83246}.btn.d.solid{background:#e2586b;color:#fff;border-color:transparent}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:14px;height:14px}
.filters{display:flex;gap:10px;flex-wrap:wrap}
input[type=text],input[type=date],input[type=number],select,textarea{background:rgba(255,255,255,.7);border:1.5px solid rgba(255,255,255,.9);border-radius:11px;padding:9px 12px;outline:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--teal-l);background:#fff}
.filters input,.filters select{width:auto}
.empty{text-align:center;color:var(--ink2);padding:34px 10px}
.note{background:rgba(255,255,255,.6);border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--ink2);margin-bottom:18px}
.note.warn{background:rgba(232,162,58,.2);color:#7a4f08}
/* modal */
.ov{position:fixed;inset:0;background:rgba(18,50,56,.45);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;overflow:auto;z-index:20}
.modal{background:linear-gradient(140deg,#eaf4f3,#e6ecf6);border-radius:22px;padding:26px 28px;width:100%;max-width:880px;box-shadow:0 30px 70px -20px rgba(0,0,0,.45)}
.modal.s{max-width:460px}
.modal h2{margin:0 0 4px;font-size:20px;font-weight:600}
.modal .sub{color:var(--ink2);font-size:12.5px;margin-bottom:18px}
.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
label{display:block;font-size:11.5px;font-weight:500;color:var(--ink2);margin-bottom:5px}
.items th{padding:4px 4px}.items td{padding:4px 4px;border:0}
.items input{padding:7px 8px;border-radius:9px}
.items .n{text-align:right}
.x{border:0;background:none;color:#a83246;font-size:18px;line-height:1;padding:4px 8px;border-radius:8px}
.x:hover{background:rgba(239,111,127,.18)}
.tot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:14px}
.sum{min-width:260px;margin-left:auto}
.sum div{display:flex;justify-content:space-between;padding:5px 0;gap:20px}
.sum .g{font-weight:600;font-size:16px;border-top:1.5px solid var(--line);margin-top:4px;padding-top:9px}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px;margin:16px 0}
.kv small{display:block;font-size:11px;color:var(--ink2)}.kv b{font-weight:500}
.steps{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.step{flex:1;min-width:150px;background:rgba(255,255,255,.65);border-radius:14px;padding:12px 14px;border:1.5px solid transparent}
.step.done{border-color:rgba(15,138,140,.5)}.step.now{border-color:var(--wait)}.step.rej{border-color:var(--no)}
.step small{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.step b{display:block;font-weight:600;font-size:13px}.step span{font-size:11.5px;color:var(--ink2)}
.step img{height:34px;display:block;margin-top:4px}
canvas.pad{width:100%;height:150px;background:#fff;border-radius:12px;border:1.5px dashed #9fbfc0;touch-action:none;display:block}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#16332f;color:#fff;padding:11px 20px;border-radius:12px;font-size:13px;z-index:40;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);max-width:90vw}
.lv{display:flex;gap:8px;align-items:center;margin-bottom:8px}.lv span{flex:none;font-size:12px;color:var(--ink2);width:86px}
@media(max-width:980px){.grid{grid-template-columns:1fr}}
@media(max-width:780px){
  body{padding:10px}.app{grid-template-columns:minmax(0,1fr);border-radius:20px}.side{min-width:0}
  .side{flex-direction:row;flex-wrap:wrap;padding:14px;border-right:0;border-bottom:1px solid rgba(255,255,255,.55)}
  .brand{width:100%;padding-bottom:8px}#nav{display:flex;gap:4px;overflow-x:auto;width:100%;padding-bottom:4px}.nav{width:auto;padding:9px 12px;white-space:nowrap;flex:none}.side hr{display:none}
  .main{padding:20px 16px 30px}h1{font-size:26px}.tiles{grid-template-columns:1fr}.fg,.kv{grid-template-columns:1fr}
  .who b,.who span{display:none}
}

.gate{max-width:420px;margin:8vh auto;background:rgba(255,255,255,.4);border:1.5px solid rgba(255,255,255,.8);border-radius:24px;padding:32px 30px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 60px -30px rgba(20,70,80,.45)}
.gate h1{font-size:24px;margin:0 0 4px}.gate p{color:var(--ink2);font-size:12.5px;margin:0 0 18px}
.gate label{margin-top:12px}.gate .btn{width:100%;justify-content:center;margin-top:18px;padding:11px}
.gate .alt{display:flex;justify-content:space-between;margin-top:14px}
.gate code{background:rgba(255,255,255,.7);padding:1px 5px;border-radius:5px;font-size:12px}
.mx th,.mx td{padding:5px 4px;border:0;text-align:left}.mx select,.mx input{padding:7px 8px;border-radius:9px;min-width:104px}
.flowhint{font-size:12px;color:var(--ink2);margin-top:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="gate"></div>
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand">Naintiland<small>Purchase Order</small></div>
    <div id="nav"></div>
  </aside>
  <main class="main">
    <div class="top">
      <div><div class="hello" id="hello"></div><h1 id="title"></h1></div>
      <div style="display:flex;align-items:center;gap:6px">
        <button class="who" data-act="profile" title="Profil & tanda tangan"><div class="ava" id="ava"></div><div><b id="whoName"></b><span id="whoRole"></span></div></button>
        <button class="btn sm" data-act="logout">Keluar</button>
      </div>
    </div>
    <div id="notes"></div>
    <div id="view"></div>
  </main>
</div>
<div id="modal"></div>
<div id="toastBox"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=1118fn1"></script>
<script src="kop.js?v=1118fn1"></script>
<script src="app.js?v=1118fn1"></script>
</body>
</html>
